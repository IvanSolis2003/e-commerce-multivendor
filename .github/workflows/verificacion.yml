name: Verificación

# Comprueba que el codigo compila antes de que llegue a main. Hasta ahora esto
# se hacia a mano y nada impedia desplegar algo roto.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Strapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Comprobar tipos
        working-directory: backend
        run: npx tsc --noEmit

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      # Se comprueban los tipos en vez de ejecutar `next build` porque el build
      # de Next intenta contactar con la API durante el prerenderizado, y eso
      # haria que la verificacion dependiera de que el backend este en pie.
      - name: Comprobar tipos
        working-directory: frontend
        run: npx tsc --noEmit
