name: Imagen del backend

# Construye la imagen de Strapi y la publica en GHCR.
#
# Existe porque la instancia EC2 es una t3.micro con 908 MB de RAM y no puede
# compilar el panel de admin: la primera vez aborto con "Reached heap limit" y,
# tras ampliar el limite y añadir swap, se quedo intercambiando memoria con el
# 90% de la CPU en espera de disco. Los runners de GitHub tienen 16 GB, asi que
# el problema desaparece de raiz.
#
# En un pull request la imagen se construye pero no se publica. Sirve para que
# un Dockerfile roto se detecte antes de entrar en main: hasta ahora el fallo
# solo aparecia despues del merge, con main publicando ya una imagen invalida.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/imagen-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/imagen-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR exige minusculas en el nombre de la imagen, y el usuario del repo
  # lleva mayusculas, asi que no se puede usar github.repository tal cual.
  IMAGEN: ghcr.io/ivansolis2003/e-commerce-multivendor/strapi

jobs:
  publicar:
    name: Construir y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          # latest para el despliegue habitual y el sha para poder volver a una
          # version concreta si un despliegue sale mal.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          # En un pull request se construye para validar el Dockerfile, y la
          # imagen se carga en el runner para poder medirla, pero no se sube.
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La cache entre ejecuciones evita repetir npm install cuando solo
          # cambia el codigo.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Medir el tamaño
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" = "pull_request" ]; then
            bytes=$(docker image inspect "$IMAGEN:latest" --format '{{.Size}}')
            etiqueta="descomprimida en disco"
          else
            # El manifiesto da los tamanos comprimidos, que es lo que realmente
            # descarga la instancia. Si buildx genero un indice multiplataforma
            # hay que bajar antes al manifiesto de linux/amd64.
            raw=$(docker buildx imagetools inspect "$IMAGEN:latest" --raw)
            bytes=$(echo "$raw" | jq '[.layers[]?.size] | add // 0')
            if [ "$bytes" = "0" ]; then
              digest=$(echo "$raw" | jq -r '.manifests[]
                | select(.platform.os == "linux" and .platform.architecture == "amd64")
                | .digest' | head -1)
              bytes=$(docker buildx imagetools inspect "$IMAGEN@$digest" --raw | jq '[.layers[].size] | add')
            fi
            etiqueta="a descargar (comprimida)"
          fi
          medida="$etiqueta: $(numfmt --to=iec "$bytes")"
          # A stdout ademas de GITHUB_ENV: lo segundo solo lo ve el paso
          # siguiente, y conviene poder leer la cifra desde el log.
          echo "Tamaño de la imagen -> $medida"
          echo "TAMANO=$medida" >> "$GITHUB_ENV"

      - name: Resumen
        env:
          EVENTO: ${{ github.event_name }}
          ETIQUETAS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            if [ "$EVENTO" = "pull_request" ]; then
              echo "### Imagen construida (no publicada)"
              echo ""
              echo "El Dockerfile es valido. La publicacion ocurre al entrar en main."
            else
              echo "### Imagen publicada"
              echo ""
              echo '```'
              echo "$ETIQUETAS"
              echo '```'
              echo ""
              echo "Para desplegar, en la instancia: \`cd ~/e-commerce-multivendor/deploy && ./actualizar.sh\`"
            fi
            echo ""
            echo "Tamaño: $TAMANO"
          } >> "$GITHUB_STEP_SUMMARY"
